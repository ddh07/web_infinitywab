# Nixpacks — Infinity WAB (Laravel 11 + Vite)
#
# Évite providers = ["php","node"] : collision Nix fréquente (nix-env exit 100).
# Un seul provider PHP + Node. Ne pas mettre seulement nodejs_20 dans nixPkgs :
# ça remplace les paquets par défaut et retire Composer du PATH (command not found).
#
# Sur la plateforme : APP_KEY, APP_ENV, APP_URL, DB_*, PORT (souvent injecté).

providers = ["php"]

[variables]
# composer.lock (Symfony 8.x) exige PHP >= 8.4
NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
# Exécuté à chaque démarrage/redéploiement du conteneur : migrations (idempotentes),
# lien de stockage public (recréé si le volume storage/ est neuf), puis mise en
# cache config/route/vue. APP_KEY ne doit JAMAIS être généré ici (il doit rester
# fixe entre les déploiements, sinon sessions et données chiffrées deviennent
# illisibles) — à définir une seule fois comme variable d'environnement sur la
# plateforme, voir .env.example.
cmd = "sh -c 'php artisan migrate --force && php artisan storage:link || true && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'"
